services:
  lm-pudins-page:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER:-}
    container_name: lm-pudins-page-local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - app-internal

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: lm-pudins-api-local
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no arquivo .env}
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET no arquivo .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Defina ADMIN_USERNAME no arquivo .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no arquivo .env}
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - lm_pudins_uploads_local:/data/uploads
    networks:
      - app-internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: lm-pudins-db-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lm_pudins}
      POSTGRES_USER: ${POSTGRES_USER:-lm_pudins_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - lm_pudins_db_data_local:/var/lib/postgresql/data
    networks:
      - app-internal
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lm_pudins_db_data_local:
  lm_pudins_uploads_local:

networks:
  app-internal:
    internal: true
