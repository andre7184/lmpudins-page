name: Validate admin catalog

on:
  push:
    branches:
      - admin-catalogo-produtos
  pull_request:
    branches:
      - main
      - admin-catalogo-produtos

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate API syntax
        run: node --check server/index.js
      - name: Build public website
        run: npm run build
