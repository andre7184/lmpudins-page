name: Deploy LM Pudins to VPS

on:
  push:
    branches:
      - versao_0-2
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: "Branch to deploy to production"
        required: true
        type: choice
        options:
          - versao_0-2
        default: versao_0-2

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy LM Pudins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}
          VITE_WHATSAPP_NUMBER: ${{ secrets.VITE_WHATSAPP_NUMBER }}
          DEPLOY_BRANCH: ${{ github.event.inputs.deploy_branch || 'versao_0-2' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deployer
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 30s
          command_timeout: 15m
          envs: DATABASE_URL,SESSION_SECRET,ADMIN_USERNAME,ADMIN_PASSWORD,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,COOKIE_SECURE,VITE_WHATSAPP_NUMBER,DEPLOY_BRANCH
          script: |
            set -eu

            SITE_DIR="$HOME/lmpudins.com.br/www"
            REPO_URL="https://github.com/andre7184/lmpudins-page.git"

            echo "==> Diretorio: $SITE_DIR"
            echo "==> Branch: $DEPLOY_BRANCH"
            mkdir -p "$HOME/lmpudins.com.br"

            if [ -d "$SITE_DIR/.git" ]; then
              cd "$SITE_DIR"
              git fetch origin
              git checkout "$DEPLOY_BRANCH"
              git pull --ff-only origin "$DEPLOY_BRANCH"
            else
              if [ -e "$SITE_DIR" ] && [ -n "$(find "$SITE_DIR" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
                echo "ERRO: $SITE_DIR existe e nao esta vazio, mas nao e um repositorio Git. Nada foi apagado."
                exit 1
              fi
              git clone --branch "$DEPLOY_BRANCH" "$REPO_URL" "$SITE_DIR"
              cd "$SITE_DIR"
            fi

            echo "==> Validando secrets obrigatorios"
            for key in DATABASE_URL SESSION_SECRET ADMIN_USERNAME ADMIN_PASSWORD POSTGRES_PASSWORD; do
              eval "value=\${$key-}"
              if [ -z "$value" ]; then
                echo "ERRO: secret obrigatorio ausente: $key"
                exit 1
              fi
            done

            echo "==> Criando .env protegido"
            umask 077
            export DATABASE_URL SESSION_SECRET ADMIN_USERNAME ADMIN_PASSWORD POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD COOKIE_SECURE VITE_WHATSAPP_NUMBER
            python3 - <<'PY'
            import os
            from pathlib import Path

            keys = [
                "DATABASE_URL", "SESSION_SECRET", "ADMIN_USERNAME", "ADMIN_PASSWORD",
                "POSTGRES_DB", "POSTGRES_USER", "POSTGRES_PASSWORD",
                "COOKIE_SECURE", "VITE_WHATSAPP_NUMBER",
            ]

            def quote(value):
                if "\n" in value or "\r" in value:
                    raise SystemExit("ERRO: variavel de ambiente contem quebra de linha.")
                return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

            Path(".env").write_text(
                "".join(f"{key}={quote(os.environ.get(key, ''))}\n" for key in keys),
                encoding="utf-8",
            )
            os.chmod(".env", 0o600)
            PY

            echo "==> Validando Docker Compose"
            docker compose config --quiet

            echo "==> Construindo e iniciando containers (padrao do deploy funcional)"
            docker compose up -d --build --remove-orphans

            echo "==> Containers"
            docker compose ps

            echo "==> Testando API"
            docker compose exec -T api node -e "fetch('http://127.0.0.1:3000/api/health').then(async r=>{console.log('API health HTTP '+r.status);process.exit(r.ok?0:1)}).catch(e=>{console.error(e);process.exit(1)})"

            echo "==> Importando produtos do arquivo-fonte para o PostgreSQL"
            docker compose exec -T api node scripts/seed-products.js

            echo "==> Confirmando catálogo pela API pública"
            docker compose exec -T api node -e "fetch('http://127.0.0.1:3000/api/products').then(async r=>{if(!r.ok)throw new Error('API produtos HTTP '+r.status);const p=await r.json();console.log('API retornou '+p.length+' produto(s): '+p.map(x=>x.slug).join(', '));if(p.length<7)throw new Error('Esperados ao menos 7 produtos ativos, recebidos '+p.length);}).catch(e=>{console.error('FALHA NA VALIDACAO DO CATALOGO:',e);process.exit(1)})"

            echo "==> Validando login e catálogo administrativo com sessão"
            docker compose exec -T api node -e "const base='http://127.0.0.1:3000';(async()=>{const login=await fetch(base+'/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:process.env.ADMIN_USERNAME,password:process.env.ADMIN_PASSWORD})});if(!login.ok)throw new Error('Login administrativo HTTP '+login.status);const cookies=login.headers.getSetCookie().map(v=>v.split(';')[0]).join('; ');if(!cookies)throw new Error('Login não retornou cookie de sessão');const response=await fetch(base+'/api/admin/products',{headers:{cookie:cookies}});if(!response.ok)throw new Error('API administrativa HTTP '+response.status);const products=await response.json();console.log('API administrativa autenticada retornou '+products.length+' produto(s).');if(products.length<7)throw new Error('Esperados ao menos 7 produtos no painel, recebidos '+products.length);})().catch(e=>{console.error('FALHA NA VALIDACAO ADMINISTRATIVA:',e);process.exit(1)})"

            echo "==> Testando frontend Nginx"
            docker compose exec -T lm-pudins-page wget -q -O /dev/null http://127.0.0.1/ || {
              echo "ERRO: frontend nao respondeu dentro do container."
              docker compose logs --tail=80 lm-pudins-page
              exit 1
            }

            echo "==> Limpando imagens antigas sem uso"
            docker image prune -f

            echo "==> Deploy da branch $DEPLOY_BRANCH concluido."
