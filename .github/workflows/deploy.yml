name: Deploy LM Pudins to VPS

on:
  # Temporariamente manual enquanto a branch main e a versao_0-1 sao sincronizadas.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy site
    runs-on: ubuntu-latest
    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deployer
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 30s
          command_timeout: 10m
          script_stop: true
          script: |
            set -eu
            SITE_DIR="$HOME/lmpudins.com.br/www"
            echo "==> Atualizando branch main em $SITE_DIR"
            cd "$SITE_DIR"
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            docker compose config --quiet
            docker compose up -d --build --remove-orphans
            docker compose ps
            docker image prune -f
